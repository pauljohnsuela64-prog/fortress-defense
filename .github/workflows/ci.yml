name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Run Vitest
        run: npm test
      - name: Build production game
        run: npm run build
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: |
          if ! npm audit --audit-level=low; then
            echo '::error::Dependency audit failed. Review the advisory output or registry error above; do not bypass the audit.'
            exit 1
          fi
